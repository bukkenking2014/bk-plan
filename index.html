<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>事業計画シミュレーター｜物件王</title>
<!--
  cache-bust: js/css更新時はこの番号を上げてください（GitHub Pagesはキャッシュが強く効くため、
  番号を上げないと利用者のブラウザに古いファイルが残り、修正が反映されないことがあります）。
-->
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

<header class="app-header no-print">
  <div class="brand">
    <span class="mark">物件王</span>
    <span class="sub">事業計画シミュレーター</span>
  </div>
  <nav class="app-nav" id="appNav">
    <button data-view="wizard">① 事業計画入力</button>
    <button data-view="schedule">② 全体フロー・スケジュール</button>
    <button data-view="report">③ 事業計画書</button>
  </nav>
  <div class="cloud-actions">
    <button id="cloudSaveBtn" class="btn-outline btn-sm" type="button">☁ 保存してURL発行</button>
    <button id="cloudSettingsBtn" class="btn-outline btn-sm" type="button" title="クラウド保存の設定" aria-label="クラウド保存の設定">⚙</button>
  </div>
</header>

<main class="app-main" id="appMain">
  <!-- JSにより動的にレンダリング -->
</main>

<script src="js/defaults.js?v=4"></script>
<script src="js/calc.js?v=4"></script>
<script src="js/schedule.js?v=4"></script>
<script src="js/content.js?v=4"></script>
<script src="js/state.js?v=4"></script>
<script src="js/cloud.js?v=9"></script>
<script src="js/ui-common.js?v=9"></script>
<script src="js/charts.js?v=9"></script>
<script src="js/ui-wizard.js?v=9"></script>
<script src="js/ui-report.js?v=9"></script>
<script src="js/main.js?v=9"></script>
</body>
</html>
